# Pinned HiDe-Prompt datasets.py::build_cifar_transform; statistics use TEST_TRANSFORM.
# Its local scale=(.05,1) variable is unused: RandomResizedCrop defaults to (.08,1).
N_TASKS: 10
N_CLASSES_PER_TASK: 10
N_CLASSES: 100
SIZE: [224, 224]
MEAN: [0.5071, 0.4867, 0.4408]
STD: [0.2675, 0.2565, 0.2761]
TRANSFORM:
  - RandomResizedCrop:
      size: 224
      interpolation: 3
      scale: [0.08, 1.0]
      ratio: [0.75, 1.3333333333333333]
  - RandomHorizontalFlip:
      p: 0.5
  - ColorJitter:
      brightness: 0.24705882352941178
  - ToTensor
  - Normalize:
      mean: [0.5071, 0.4867, 0.4408]
      std: [0.2675, 0.2565, 0.2761]
TEST_TRANSFORM:
  - Resize:
      size: 256
      interpolation: 3
  - CenterCrop:
      size: 224
  - ToTensor
  - Normalize:
      mean: [0.5071, 0.4867, 0.4408]
      std: [0.2675, 0.2565, 0.2761]
n_epochs: 70
batch_size: 48
